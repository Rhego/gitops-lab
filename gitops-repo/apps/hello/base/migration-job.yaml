# Simula el paso "expand" de la base de datos como hook PreSync.
# Ejercicio 5: cambia "exit 0" por "exit 1" y observa que el Deployment viejo sigue sirviendo.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-expand
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo 'expand: ALTER TABLE ... ADD canal_id'; sleep 5; exit 0"]
