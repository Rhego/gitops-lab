apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hello-secret
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: hello-secret
  data:
    - secretKey: message
      remoteRef:
        key: lab/hello
        property: message
